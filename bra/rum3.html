<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planritning 3 - 3920x1280 Canvas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #070707;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
        }

        .canvas-wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        canvas {
            background-color: #e5e7eb;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 3920 / 1280;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="canvas-wrapper">
        <canvas id="floorPlanCanvas" width="3920" height="1280"></canvas>
    </div>

    <!-- Separerade script-filer -->
    <script src="js/FloorPlan.js"></script>
    <script src="js/rum3.js"></script>
</body>
</html>
