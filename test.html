<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Player Test Room</title>
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      background: #1e1e24;
      border: 2px solid #444;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <canvas id="testCanvas" width="800" height="600"></canvas>

  <script type="module">
    import { Player } from "./game/entity/player.js";

    // Lightweight inline InputHandler so path issues never break this test
    class TestInputHandler {
      constructor(canvas) {
        this.isA = false; this.isD = false; this.isW = false; this.isS = false;
        this.lastH = 0; this.lastV = 0;
        this.mouse = { x: 0, y: 0 };

        window.addEventListener('keydown', (e) => {
          if (e.code === 'KeyA') { this.isA = true; this.lastH = -1; }
          if (e.code === 'KeyD') { this.isD = true; this.lastH = 1; }
          if (e.code === 'KeyW') { this.isW = true; this.lastV = -1; }
          if (e.code === 'KeyS') { this.isS = true; this.lastV = 1; }
        });

        window.addEventListener('keyup', (e) => {
          if (e.code === 'KeyA') this.isA = false;
          if (e.code === 'KeyD') this.isD = false;
          if (e.code === 'KeyW') this.isW = false;
          if (e.code === 'KeyS') this.isS = false;
        });

        window.addEventListener('mousemove', (e) => {
          const rect = canvas.getBoundingClientRect();
          this.mouse.x = e.clientX - rect.left;
          this.mouse.y = e.clientY - rect.top;
        });
      }

      getAxis() {
        let x = 0;
        if (this.isA && this.isD) x = this.lastH;
        else if (this.isA) x = -1;
        else if (this.isD) x = 1;

        let y = 0;
        if (this.isW && this.isS) y = this.lastV;
        else if (this.isW) y = -1;
        else if (this.isS) y = 1;

        return { x, y };
      }
    }

    const canvas = document.getElementById("testCanvas");
    const ctx = canvas.getContext("2d");

    const input = new TestInputHandler(canvas);
    const player = new Player(400, 300);

    const testObstacle = { x: 550, y: 250, width: 50, height: 100 };

    function loop() {
      player.update(input);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw obstacle (red when touched, gray when idle)
      const hit = player.intersects(testObstacle);
      ctx.fillStyle = hit ? "rgba(230, 40, 40, 0.8)" : "rgba(80, 80, 100, 0.8)";
      ctx.fillRect(testObstacle.x, testObstacle.y, testObstacle.width, testObstacle.height);

      // Draw player and laser sight
      player.draw(ctx);

      // Draw collision debug circle
      ctx.save();
      ctx.strokeStyle = hit ? "red" : "lime";
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
