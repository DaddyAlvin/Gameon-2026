<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planritning - 1920x1080 Canvas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #0d0d0d;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
        }

        .canvas-wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        canvas {
            background-color: #e5e7eb;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 1920 / 1080;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="canvas-wrapper">
        <canvas id="floorPlanCanvas" width="1920" height="1080"></canvas>
    </div>

    <script>
        window.onload = function() {
            const canvas = document.getElementById('floorPlanCanvas');
            const ctx = canvas.getContext('2d');

            function draw() {
                // Rensa bakgrund (Golvyta)
                ctx.fillStyle = "#e2e8f0";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // 1. Golvyta för Biblioteket (Tonad för att markera rummet)
                ctx.fillStyle = "#f0f9ff";
                ctx.fillRect(1060, 40, 760, 350);

                // 2. Fasta svarta väggar
                drawSolidWalls();

                // 3. Glasvägg för Biblioteket
                drawLibraryGlassWall();

                // 4. In- och Utgångar (EXIT / Entrance / Låst dörr)
                drawExitsAndDoors();

                // 5. Bild-Placeholders för alla objekt
                drawPlaceholders();

                // 6. Vakt-patrullering & Personer
                drawGuardPathAndCharacters();
            }

            function drawSolidWalls() {
                ctx.fillStyle = "#000000"; // Svarta fasta väggar
                const wT = 16;              // Väggtjocklek

                // --- Yttre Ram ---
                // Vänster yttervägg
                ctx.fillRect(40, 40, wT, 980);

                // Övre vägg (delad av EXIT)
                ctx.fillRect(40, 40, 540, wT);           // Vänster om EXIT
                ctx.fillRect(780, 40, 1060, wT);         // Höger om EXIT

                // Nedre vägg
                ctx.fillRect(40, 1004, 1800, wT);

                // Höger vägg (delad av Entrance)
                ctx.fillRect(1824, 40, wT, 350);          // Ovanför Entrance
                ctx.fillRect(1824, 570, wT, 450);         // Under Entrance

                // --- Inre Skiljeväggar ---
                // Vertikal avskiljare
                ctx.fillRect(1060, 40, wT, 350);          // Vänster om biblioteket
                ctx.fillRect(1060, 540, wT, 480);         // Vänster om Maria / nedre rummet

                // Horisontell korridorvägg (mellan Entrance-korridor och nedre rummet)
                ctx.fillRect(1060, 540, 780, wT);
            }

            function drawLibraryGlassWall() {
                // Glasväggens position (nederkanten av biblioteket)
                const gx = 1060;
                const gy = 390;
                const gWidth = 780;
                const gHeight = 16;

                ctx.save();

                // Cyan/Ljusblå halvtransparens
                ctx.fillStyle = "rgba(56, 189, 248, 0.35)";
                ctx.fillRect(gx, gy, gWidth, gHeight);

                // Stålramar (Övre & nedre linje)
                ctx.strokeStyle = "#0284c7";
                ctx.lineWidth = 3;
                ctx.strokeRect(gx, gy, gWidth, gHeight);

                // Glaspaneler & Diagonala reflektioner
                const panelWidth = 110;
                for (let x = gx; x < gx + gWidth; x += panelWidth) {
                    // Panelfog
                    ctx.strokeStyle = "rgba(2, 132, 199, 0.6)";
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(x, gy);
                    ctx.lineTo(x, gy + gHeight);
                    ctx.stroke();

                    // Glasglans / Glanslinje
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(x + 15, gy + gHeight - 2);
                    ctx.lineTo(x + 40, gy + 2);
                    ctx.stroke();
                }

                // Tydlig Skylt/Beteckning för Glasvägg
                const badgeW = 240;
                const badgeH = 28;
                const badgeX = gx + (gWidth / 2) - (badgeW / 2);
                const badgeY = gy - 6;

                ctx.fillStyle = "#0284c7";
                ctx.beginPath();
                ctx.roundRect(badgeX, badgeY, badgeW, badgeH, 6);
                ctx.fill();

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 13px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("GLASVÄGG (BIBLIOTEK)", gx + gWidth / 2, badgeY + badgeH / 2);

                ctx.restore();
            }

            function drawExitsAndDoors() {
                // --- EXIT (Längst upp) ---
                ctx.clearRect(580, 35, 200, 26);
                ctx.fillStyle = "#22c55e";
                ctx.fillRect(580, 44, 200, 8); // Grönt dörrfält

                ctx.fillStyle = "#15803d";
                ctx.font = "bold 24px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "bottom";
                ctx.fillText("EXIT", 680, 36);

                // --- ENTRANCE (Höger) ---
                ctx.clearRect(1818, 390, 26, 180);
                ctx.fillStyle = "#3b82f6";
                ctx.fillRect(1824, 390, 8, 180); // Blått dörrfält

                ctx.save();
                ctx.translate(1865, 480);
                ctx.rotate(Math.PI / 2);
                ctx.fillStyle = "#1d4ed8";
                ctx.font = "bold 24px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("Entrance", 0, 0);
                ctx.restore();

                // --- Låst dörr / No access ---
                ctx.fillStyle = "#ef4444";
                ctx.fillRect(1085, 388, 170, 20);
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 11px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("Låst dörr / No access", 1170, 398);
            }

            function drawPlaceholderBox(x, y, width, height, text, options = {}) {
                ctx.save();
                
                // Bakgrund i neutral ton
                ctx.fillStyle = options.bgColor || "#ffffff";
                ctx.beginPath();
                ctx.roundRect(x, y, width, height, options.radius || 8);
                ctx.fill();

                // Streckad ram
                ctx.strokeStyle = options.borderColor || "#64748b";
                ctx.lineWidth = options.lineWidth || 2;
                ctx.setLineDash(options.dash || [8, 5]);
                ctx.stroke();

                // Ikon och Text
                ctx.setLineDash([]);
                ctx.fillStyle = options.textColor || "#334155";
                const fontSize = Math.min(Math.max(12, height * 0.26), 20);
                ctx.font = `bold ${fontSize}px sans-serif`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(`🖼 ${text}`, x + width / 2, y + height / 2);

                ctx.restore();
            }

            function drawPlaceholders() {
                // 1. Biljardbord (Stort rektangulärt objekt)
                drawPlaceholderBox(210, 300, 280, 490, "BILJARDBORD", {
                    bgColor: "#f8fafc",
                    borderColor: "#475569"
                });

                // 2. Bokhyllor (Rektangulära placeholders i Biblioteket)
                drawPlaceholderBox(1240, 100, 440, 70, "BOKHYLLA 1");
                drawPlaceholderBox(1240, 220, 440, 70, "BOKHYLLA 2");

                // Bokhylla i nedre rummet
                drawPlaceholderBox(1140, 590, 440, 70, "BOKHYLLA 3");

                // 3. Växter (Kvadratiska placeholders)
                const plantSize = 55;
                drawPlaceholderBox(1120, 90, plantSize, plantSize, "VÄXT", { fontSize: 10 });
                drawPlaceholderBox(1120, 160, plantSize, plantSize, "VÄXT", { fontSize: 10 });
                drawPlaceholderBox(1120, 230, plantSize, plantSize, "VÄXT", { fontSize: 10 });
                drawPlaceholderBox(1120, 300, plantSize, plantSize, "VÄXT", { fontSize: 10 });

                // Växt i nedre rummet
                drawPlaceholderBox(1120, 710, plantSize, plantSize, "VÄXT", { fontSize: 10 });
            }

            function drawGuardPathAndCharacters() {
                // Vaktens rörelsebana
                const px = 670;
                const py = 320;
                const pw = 250;
                const ph = 440;

                ctx.strokeStyle = "#475569";
                ctx.lineWidth = 2;
                ctx.strokeRect(px, py, pw, ph);

                // Pil uppåt på banan
                ctx.beginPath();
                ctx.moveTo(px - 8, 700);
                ctx.lineTo(px, 685);
                ctx.lineTo(px + 8, 700);
                ctx.stroke();

                // Vakt (Placeholder badge)
                drawBadge(670, 640, "VAKT", "#2563eb", "#dbeafe");

                // Maria (Placeholder badge)
                drawBadge(1145, 830, "MARIA", "#ec4899", "#fce7f3");
            }

            function drawBadge(x, y, label, strokeColor, fillColor) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(x, y, 40, 0, Math.PI * 2);
                ctx.fillStyle = fillColor;
                ctx.fill();

                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.fillStyle = "#0f172a";
                ctx.font = "bold 16px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(label, x, y);
                ctx.restore();
            }

            // Rendera ritningen
            draw();
        };
    </script>
</body>
</html>
